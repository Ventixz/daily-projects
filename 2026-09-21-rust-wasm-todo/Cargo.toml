[package]
name = "rust-wasm-todo"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"

[dependencies.web-sys]
version = "0.3"
features = [
  "Document",
  "Element",
  "HtmlElement",
  "HtmlInputElement",
  "Window",
  "Storage",
  "Event",
  "EventTarget",
  "KeyboardEvent",
  "DomTokenList",
  "Location",
  "console",
]

[profile.release]
opt-level = "s"
