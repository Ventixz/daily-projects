<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Todo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <h1>Todo</h1>

    <form id="add-form" autocomplete="off">
      <input id="add-input" type="text" placeholder="What needs doing?" aria-label="New todo text" />
      <button type="submit">Add</button>
    </form>

    <div class="toolbar">
      <div class="filters">
        <button type="button" data-filter="all" class="active">All</button>
        <button type="button" data-filter="active">Active</button>
        <button type="button" data-filter="completed">Completed</button>
      </div>
      <div class="history-controls">
        <button type="button" id="undo-btn" title="Undo (Ctrl+Z)" disabled>Undo</button>
        <button type="button" id="redo-btn" title="Redo (Ctrl+Shift+Z)" disabled>Redo</button>
      </div>
    </div>

    <div id="todo-list"></div>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
