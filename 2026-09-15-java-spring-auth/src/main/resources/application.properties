spring.application.name=spring-auth

spring.datasource.url=jdbc:h2:mem:springauth;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-please-32bytes-min}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
